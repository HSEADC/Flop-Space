<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title> FlopSpace // Поиск Команды </title>

<body>

  <header> </header>

  <div class="layout"> 
     
    <navigation> </navigation>

    <div class="layout__content">

          <div class="topic-list"> 

          </div>

      </div>

      <div class="layout__body">

              </div>

            </div>

          </div>

        </div>

        <aside class="layout__side-bar"> 

          <div class="side-container"> 

            <h1 class="typography__header1"> Подобрали для вас </h1>

            <section>

            <p class="typography__body2 typography--muted"> Громкие провалы 2025 </p>

            <p class="typography__body2 typography--muted"> Самые нелепые </p>

            </section>
            
          </div>

        </aside>
      
      </div>

        <div class="mobile-navigation__body">

          <div class="mobile-navigation__item"> 
          
              <svg class="icon"><use href="#icon-podcast"></use></svg>

          </div>
      </div>
